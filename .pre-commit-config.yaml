repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: \.py$

      - id: ruff-format
        files: \.(py|md)$
        types_or: [python, markdown]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.97
    hooks:
      - id: ty
        args: [--locked]
