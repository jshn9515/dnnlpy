[project]
name = "dnnlpy"
version = "2026.11.01.dev0"
keywords = ["deep learning", "pytorch", "utilities"]
description = "A utility library for deep learning notes, providing common functions and tools to support the main content of the deep learning notes collection."
authors = [{ name = "Yunjie Lin", email = "jshn9510@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    # PyTorch ecosystem
    "torch[opt-einsum,pyyaml]>=2.15.0,<2.16.0",

    # Scientific computing and visualization
    "matplotlib>=3.11.0,<3.12.0",
    "numpy>=2.5.0,<2.6.0",
    "platformdirs>=4.10.0,<5.0.0",
]

[project.optional-dependencies]
rl = [
    "gymnasium[array-api,classic-control,torch]>=1.4.0,<1.5.0",
    "pygame-ce>=2.5.0,<2.6.0",
]
dev = [
    "pre-commit>=4.7.0,<4.8.0",
    "ruff>=0.17.0,<0.18.0",
    "ty==0.0.97",
]
docs = [
    "furo==2025.12.19",
    "sphinx>=9.1.0,<9.2.0; python_version == '3.12'",
    "sphinx>=9.2.0,<9.3.0; python_version >= '3.13'",
    "sphinx-autoapi>=3.9.0,<3.10.0",
]
test = ["pytest>=9.2.0,<9.3.0", "pytest-cov>=7.1.0,<7.2.0"]

[project.urls]
Homepage = "https://github.com/jshn9515/dnnlpy"
Repository = "https://github.com/jshn9515/dnnlpy.git"
Documentation = "https://jshn9515.github.io/dnnlpy/"

[project.scripts]
dnnlpy-cs221-a4-train = "dnnlpy.cli.cs221.assignment4.train:main"

[tool.uv]
torch-backend = "cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.coverage.run]
source = ["dnnlpy"]
branch = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
