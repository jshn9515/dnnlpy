ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

pre-commit:
  - changed-files:
      - any-glob-to-any-file: ".pre-commit-config.yaml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "requirements.txt"
          - "pyproject.toml"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
