ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

pre-commit:
  - changed-files:
      - any-glob-to-any-file: ".pre-commit-config.yaml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/renovate.json"
          - "pyproject.toml"
          - "uv.lock"

cs221:
  - changed-files:
      - any-glob-to-any-file:
          - "src/dnnlpy/cs221/**"
          - "src/dnnlpy/cli/cs221/**"
          - "tests/test_cs221/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
