ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

pre-commit:
  - changed-files:
      - any-glob-to-any-file: ".pre-commit-config.yaml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "requirements.txt"
          - "pyproject.toml"

cs221:
  - changed-files:
      - any-glob-to-any-file:
          - "src/dnnlpy/cs221/**"
          - "src/dnnlpy/cli/cs221/**"
          - "tests/test_cs221/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
